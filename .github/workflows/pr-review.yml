name: Gemini PR Reviewer (Strict)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > diff.txt

          if [ ! -s diff.txt ]; then
            echo "No changes found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Review Code with Gemini
        if: steps.get_diff.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF_CONTENT=$(head -c 30000 diff.txt)

          # Build the strict system/rubric prompt as a JSON-safe string via jq
          PROMPT=$(jq -n --arg diff "$DIFF_CONTENT" '
          ($diff) as $d |
          "You are a STRICT senior code reviewer, equivalent in rigor to CodeRabbit or Qodo. You are reviewing a Git diff from a TypeScript / React / Next.js codebase.\n\nYou MUST flag every occurrence of the following as a BLOCKING issue (severity: blocking). Do not soften, do not skip, do not give benefit of the doubt:\n\n1. Use of `any` type anywhere (parameters, return types, generics, `as any`, `: any`). Always require an explicit, specific type.\n2. Inline `style={{ ... }}` props used alongside Tailwind/className, or inline styles used at all when the project uses Tailwind. Require Tailwind classes or a stylesheet instead.\n3. Leftover `console.log`, `console.warn`, `console.error`, `debugger` statements, or commented-out dead code.\n4. Empty or no-op function bodies, event handlers that do nothing meaningful (e.g. a Button with an onClick that only logs), or components with empty JSX children that appear unfinished (e.g. `<Button></Button>` with no label, icon, or children).\n5. Unused variables, unused function parameters, unused imports.\n6. Missing or weak prop typing: props typed as `any`, missing an interface/type for component props, or destructured props with no type at all.\n7. Non-descriptive naming (e.g. `e`, `x`, `data` for anything beyond a trivial one-line arrow function).\n8. Missing error handling around async calls, fetches, or JSON parsing.\n9. Accessibility issues on interactive elements (buttons/links with no discernible text, label, or aria-label).\n10. Hardcoded secrets, API keys, or credentials.\n11. Duplicate logic that should be extracted/reused.\n12. Direct DOM manipulation in React (document.querySelector, getElementById) instead of refs/state.\n\nFor EVERY issue found, cite the exact line/snippet from the diff and explain why it is a problem and how to fix it.\n\nRespond with ONLY valid JSON, no markdown fences, no prose outside the JSON, matching exactly this schema:\n{\n  \"approved\": boolean,\n  \"summary\": string,\n  \"issues\": [\n    {\n      \"severity\": \"blocking\" | \"warning\" | \"suggestion\",\n      \"file_hint\": string,\n      \"snippet\": string,\n      \"problem\": string,\n      \"fix\": string\n    }\n  ]\n}\n\nSet \"approved\" to false if there is ANY issue with severity \"blocking\". Only set \"approved\" to true if there are zero blocking issues. Be exhaustive — under-reporting is a failure on your part.\n\nHere is the diff:\n\n" + $d
          ')

          REQUEST_BODY=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          RAW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$RAW_TEXT" ]; then
            echo "Failed to get a review from Gemini API. Raw response:"
            echo "$RESPONSE"
            gh pr comment $PR_NUMBER --body $'### 🤖 Gemini AI Code Review\n\n⚠️ Review failed to run (empty/invalid API response). Failing the check so this does not merge silently.'
            exit 1
          fi

          # Strip ```json fences if the model added them anyway
          CLEAN_JSON=$(echo "$RAW_TEXT" | sed -e 's/^```json//' -e 's/^```//' -e 's/```$//')

          echo "$CLEAN_JSON" > review.json

          if ! jq empty review.json > /dev/null 2>&1; then
            echo "Gemini did not return valid JSON. Raw output:"
            cat review.json
            gh pr comment $PR_NUMBER --body $'### 🤖 Gemini AI Code Review\n\n⚠️ Review returned malformed output and could not be parsed. Failing the check, please re-run.'
            exit 1
          fi

          APPROVED=$(jq -r '.approved' review.json)
          SUMMARY=$(jq -r '.summary' review.json)
          BLOCKING_COUNT=$(jq '[.issues[]? | select(.severity=="blocking")] | length' review.json)

          # Build a readable markdown comment from the JSON
          {
            echo "### 🤖 Gemini AI Code Review"
            echo ""
            if [ "$APPROVED" = "true" ]; then
              echo "✅ **No blocking issues found.**"
            else
              echo "❌ **$BLOCKING_COUNT blocking issue(s) found. This PR should not be merged as-is.**"
            fi
            echo ""
            echo "**Summary:** $SUMMARY"
            echo ""
            jq -r '.issues[]? | "- **[\(.severity | ascii_upcase)]** `\(.file_hint)`\n  - Snippet: `\(.snippet)`\n  - Problem: \(.problem)\n  - Fix: \(.fix)\n"' review.json
          } > comment.md

          gh pr comment $PR_NUMBER --body-file comment.md

          if [ "$APPROVED" != "true" ]; then
            echo "Blocking issues found ($BLOCKING_COUNT). Failing the check."
            exit 1
          fi

          echo "No blocking issues. Check passes."
