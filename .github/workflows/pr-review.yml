name: Gemini PR Reviewer (Strict)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > diff.txt

          if [ ! -s diff.txt ]; then
            echo "No changes found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Review Code with Gemini
        if: steps.get_diff.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. Create a clean system prompt file
          cat << 'EOF' > prompt_rubric.txt
          You are a STRICT senior code reviewer, equivalent in rigor to CodeRabbit. You are reviewing a Git diff from a TypeScript / React / Next.js codebase.

          You MUST flag every occurrence of the following as a BLOCKING issue (severity: blocking):
          1. Use of `any` type anywhere (parameters, return types, generics, `as any`, `: any`). Always require explicit types.
          2. Inline `style={{ ... }}` props used alongside Tailwind/className, or inline styles used at all when the project uses Tailwind.
          3. Leftover `console.log`, `console.warn`, `console.error`, `debugger` statements, or commented-out dead code.
          4. Empty function bodies, event handlers that do nothing meaningful, or components with empty JSX children.
          5. Unused variables, unused parameters, unused imports.
          6. Missing or weak prop typing.
          7. Non-descriptive naming (e.g. `e`, `x`, `data`).
          8. Missing error handling around async calls, fetches, or JSON parsing.
          9. Accessibility issues on interactive elements.
          10. Hardcoded secrets, API keys, or credentials.

          Respond ONLY with valid JSON matching this exact schema:
          {
            "approved": boolean,
            "summary": "string",
            "walkthrough": [
              { "area": "string", "description": "string" }
            ],
            "changes_table": [
              { "file": "string", "change_summary": "string" }
            ],
            "issues": [
              {
                "severity": "blocking | warning | suggestion",
                "file_hint": "string",
                "line_hint": "string",
                "title": "string",
                "problem": "string",
                "before_snippet": "string",
                "after_snippet": "string"
              }
            ]
          }
          Set "approved" to false if there is ANY issue with severity "blocking".
          EOF

          PROMPT_TEXT=$(cat prompt_rubric.txt)
          DIFF_CONTENT=$(head -c 30000 diff.txt)

          # 2. Safely construct JSON payload using jq
          jq -n \
            --arg prompt "$PROMPT_TEXT" \
            --arg diff "$DIFF_CONTENT" \
            '{
              contents: [{
                parts: [{text: ($prompt + "\n\nHere is the diff:\n\n" + $diff)}]
              }],
              generationConfig: {
                responseMimeType: "application/json"
              }
            }' > payload.json

          # 3. Send request to Gemini API
          RESPONSE=$(curl -s -X POST "[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          RAW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$RAW_TEXT" ]; then
            echo "API Response failed or empty. Full response from Gemini:"
            echo "$RESPONSE"
            gh pr comment $PR_NUMBER --body $'### 🤖 Gemini AI Code Review\n\n⚠️ Review failed to run. Check GitHub Actions run logs for details.'
            exit 1
          fi

          echo "$RAW_TEXT" > review.json

          if ! jq empty review.json > /dev/null 2>&1; then
            echo "Gemini did not return valid JSON. Output was:"
            cat review.json
            gh pr comment $PR_NUMBER --body $'### 🤖 Gemini AI Code Review\n\n⚠️ Returned output was malformed JSON.'
            exit 1
          fi

          APPROVED=$(jq -r '.approved' review.json)
          SUMMARY=$(jq -r '.summary' review.json)
          BLOCKING_COUNT=$(jq '[.issues[]? | select(.severity=="blocking")] | length' review.json)
          WARNING_COUNT=$(jq '[.issues[]? | select(.severity=="warning")] | length' review.json)
          SUGGESTION_COUNT=$(jq '[.issues[]? | select(.severity=="suggestion")] | length' review.json)

          # Build Markdown Comment
          {
            echo "## 🤖 Gemini Code Review"
            echo ""
            if [ "$APPROVED" = "true" ]; then
              echo "> ✅ **No blocking issues found.**"
            else
              echo "> ❌ **$BLOCKING_COUNT blocking issue(s) found — this PR should not be merged as-is.**"
            fi
            echo ""
            echo "\`\`\`"
            echo "Blocking: $BLOCKING_COUNT   Warnings: $WARNING_COUNT   Suggestions: $SUGGESTION_COUNT"
            echo "\`\`\`"
            echo ""

            echo "### 📝 Summary"
            echo ""
            echo "$SUMMARY"
            echo ""

            WALKTHROUGH_COUNT=$(jq '.walkthrough | length' review.json)
            if [ "$WALKTHROUGH_COUNT" != "0" ] && [ "$WALKTHROUGH_COUNT" != "null" ]; then
              echo "### 🚶 Walkthrough"
              echo ""
              jq -r '.walkthrough[]? | "- **\(.area):** \(.description)"' review.json
              echo ""
            fi

            CHANGES_COUNT=$(jq '.changes_table | length' review.json)
            if [ "$CHANGES_COUNT" != "0" ] && [ "$CHANGES_COUNT" != "null" ]; then
              echo "### 📂 Changes"
              echo ""
              echo "| File | Change |"
              echo "|---|---|"
              echo "| `src/app/page.tsx` | Added code pattern test |"
              echo ""
            fi

            ISSUES_COUNT=$(jq '.issues | length' review.json)
            if [ "$ISSUES_COUNT" != "0" ] && [ "$ISSUES_COUNT" != "null" ]; then
              echo "### 🔍 Review Comments"
              echo ""

              for sev in blocking warning suggestion; do
                SEV_COUNT=$(jq --arg s "$sev" '[.issues[]? | select(.severity==$s)] | length' review.json)
                if [ "$SEV_COUNT" != "0" ]; then
                  case "$sev" in
                    blocking) ICON="🛑" ;;
                    warning) ICON="⚠️" ;;
                    suggestion) ICON="💡" ;;
                  esac
                  echo "#### $ICON ${sev^} ($SEV_COUNT)"
                  echo ""
                  jq -r --arg s "$sev" '
                    .issues[]? | select(.severity==$s) |
                    "<details>\n<summary><strong>\(.file_hint)" + (if .line_hint != "" then " — \(.line_hint)" else "" end) + "</strong>: \(.title)</summary>\n\n\(.problem)\n\n```diff\n- " + (.before_snippet | gsub("\n"; "\n- ")) + "\n+ " + (.after_snippet | gsub("\n"; "\n+ ")) + "\n```\n\n</details>\n"
                  ' review.json
                fi
              done
            fi

            echo ""
            echo "---"
            echo "*Automated review by Gemini. Verify suggestions before applying.*"
          } > comment.md

          gh pr comment $PR_NUMBER --body-file comment.md

          if [ "$APPROVED" != "true" ]; then
            echo "Blocking issues found ($BLOCKING_COUNT). Failing check."
            exit 1
          fi
