name: Gemini PR Reviewer (Strict)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > diff.txt

          if [ ! -s diff.txt ]; then
            echo "No changes found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Review Code with Gemini
        if: steps.get_diff.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is empty or not set."
            gh pr comment $PR_NUMBER --body $'### 🤖 Gemini AI Code Review\n\n⚠️ `GEMINI_API_KEY` repository secret is missing or empty. Add it under Settings → Secrets and variables → Actions, then re-run this check.'
            exit 1
          fi

          DIFF_CONTENT=$(head -c 30000 diff.txt)

          # Build the strict system/rubric prompt as a JSON-safe string via jq
          PROMPT=$(jq -n --arg diff "$DIFF_CONTENT" '
          ($diff) as $d |
          "You are a STRICT senior code reviewer, equivalent in rigor and output style to CodeRabbit. You are reviewing a Git diff from a TypeScript / React / Next.js codebase.\n\nYou MUST flag every occurrence of the following as a BLOCKING issue (severity: blocking). Do not soften, do not skip, do not give benefit of the doubt:\n\n1. Use of `any` type anywhere (parameters, return types, generics, `as any`, `: any`). Always require an explicit, specific type.\n2. Inline `style={{ ... }}` props used alongside Tailwind/className, or inline styles used at all when the project uses Tailwind. Require Tailwind classes or a stylesheet instead.\n3. Leftover `console.log`, `console.warn`, `console.error`, `debugger` statements, or commented-out dead code.\n4. Empty or no-op function bodies, event handlers that do nothing meaningful (e.g. a Button with an onClick that only logs), or components with empty JSX children that appear unfinished (e.g. `<Button></Button>` with no label, icon, or children).\n5. Unused variables, unused function parameters, unused imports.\n6. Missing or weak prop typing: props typed as `any`, missing an interface/type for component props, or destructured props with no type at all.\n7. Non-descriptive naming (e.g. `e`, `x`, `data` for anything beyond a trivial one-line arrow function).\n8. Missing error handling around async calls, fetches, or JSON parsing.\n9. Accessibility issues on interactive elements (buttons/links with no discernible text, label, or aria-label).\n10. Hardcoded secrets, API keys, or credentials.\n11. Duplicate logic that should be extracted/reused.\n12. Direct DOM manipulation in React (document.querySelector, getElementById) instead of refs/state.\n\nFor EVERY issue found, cite the exact line/snippet from the diff and explain why it is a problem, then provide a corrected code snippet.\n\nRespond with ONLY a JSON object, matching exactly this schema:\n{\n  \"approved\": boolean,\n  \"summary\": string,\n  \"walkthrough\": [\n    { \"area\": string, \"description\": string }\n  ],\n  \"changes_table\": [\n    { \"file\": string, \"change_summary\": string }\n  ],\n  \"issues\": [\n    {\n      \"severity\": \"blocking\" | \"warning\" | \"suggestion\",\n      \"file_hint\": string,\n      \"line_hint\": string,\n      \"title\": string,\n      \"problem\": string,\n      \"before_snippet\": string,\n      \"after_snippet\": string\n    }\n  ]\n}\n\nField guidance:\n- \"summary\": 2-4 sentences, high level, what this PR does overall.\n- \"walkthrough\": 2-6 bullet-style entries grouping the conceptual changes (e.g. area = a component or concern, description = what changed and why it matters), written like a PR walkthrough, not a diff dump.\n- \"changes_table\": one row per changed file with a one-line description of what changed in that file.\n- \"issues[].before_snippet\": the exact problematic code from the diff (short, just the relevant lines).\n- \"issues[].after_snippet\": your corrected replacement for that exact snippet, same language, ready to paste in.\n- \"issues[].line_hint\": approximate line number or location description if known, else empty string.\n\nSet \"approved\" to false if there is ANY issue with severity \"blocking\". Only set \"approved\" to true if there are zero blocking issues. Be exhaustive — under-reporting is a failure on your part.\n\nHere is the diff:\n\n" + $d
          ')

          REQUEST_BODY=$(jq -n --arg prompt "$PROMPT" '{
            contents: [{parts: [{text: $prompt}]}],
            generationConfig: {
              responseMimeType: "application/json"
            }
          }')

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \\
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "Gemini API HTTP status: $HTTP_STATUS"
          echo "Gemini API raw response:"
          echo "$RESPONSE"

          if [ "$HTTP_STATUS" != "200" ]; then
            API_ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // "Unknown error"')
            COMMENT_BODY=$(printf '### 🤖 Gemini AI Code Review\n\n⚠️ Gemini API request failed with HTTP %s: %s\n\nFailing the check so this does not merge silently. Check the workflow run logs for the full response.' "$HTTP_STATUS" "$API_ERROR_MSG")
            gh pr comment $PR_NUMBER --body "$COMMENT_BODY"
            exit 1
          fi

          BLOCK_REASON=$(echo "$RESPONSE" | jq -r '.promptFeedback.blockReason // empty')
          if [ -n "$BLOCK_REASON" ]; then
            COMMENT_BODY=$(printf '### 🤖 Gemini AI Code Review\n\n⚠️ Gemini blocked this request (reason: %s), likely a safety filter on the diff content. Failing the check, please review manually.' "$BLOCK_REASON")
            gh pr comment $PR_NUMBER --body "$COMMENT_BODY"
            exit 1
          fi

          RAW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$RAW_TEXT" ]; then
            FINISH_REASON=$(echo "$RESPONSE" | jq -r '.candidates[0].finishReason // "unknown"')
            COMMENT_BODY=$(printf '### 🤖 Gemini AI Code Review\n\n⚠️ Gemini returned no review text (finishReason: %s). Failing the check so this does not merge silently. Check the workflow run logs for the full response.' "$FINISH_REASON")
            gh pr comment $PR_NUMBER --body "$COMMENT_BODY"
            exit 1
          fi

          # Strip ```json fences just in case, even though responseMimeType should prevent them
          CLEAN_JSON=$(echo "$RAW_TEXT" | sed -e 's/^```json//' -e 's/^```//' -e 's/```$//')

          echo "$CLEAN_JSON" > review.json

          if ! jq empty review.json > /dev/null 2>&1; then
            echo "Gemini did not return valid JSON. Raw output:"
            cat review.json
            gh pr comment $PR_NUMBER --body $'### 🤖 Gemini AI Code Review\n\n⚠️ Review returned malformed output and could not be parsed. Failing the check, please re-run.'
            exit 1
          fi

          APPROVED=$(jq -r '.approved' review.json)
          SUMMARY=$(jq -r '.summary' review.json)
          BLOCKING_COUNT=$(jq '[.issues[]? | select(.severity=="blocking")] | length' review.json)
          WARNING_COUNT=$(jq '[.issues[]? | select(.severity=="warning")] | length' review.json)
          SUGGESTION_COUNT=$(jq '[.issues[]? | select(.severity=="suggestion")] | length' review.json)

          # Build a CodeRabbit-style markdown comment from the JSON
          {
            echo "## 🤖 Gemini Code Review"
            echo ""
            if [ "$APPROVED" = "true" ]; then
              echo "> ✅ **No blocking issues found.**"
            else
              echo "> ❌ **$BLOCKING_COUNT blocking issue(s) found — this PR should not be merged as-is.**"
            fi
            echo ""
            echo "\`\`\`"
            echo "Blocking: $BLOCKING_COUNT   Warnings: $WARNING_COUNT   Suggestions: $SUGGESTION_COUNT"
            echo "\`\`\`"
            echo ""

            echo "### 📝 Summary"
            echo ""
            echo "$SUMMARY"
            echo ""

            WALKTHROUGH_COUNT=$(jq '.walkthrough | length' review.json)
            if [ "$WALKTHROUGH_COUNT" != "0" ] && [ "$WALKTHROUGH_COUNT" != "null" ]; then
              echo "### 🚶 Walkthrough"
              echo ""
              jq -r '.walkthrough[]? | "- **\(.area):** \(.description)"' review.json
              echo ""
            fi

            CHANGES_COUNT=$(jq '.changes_table | length' review.json)
            if [ "$CHANGES_COUNT" != "0" ] && [ "$CHANGES_COUNT" != "null" ]; then
              echo "### 📂 Changes"
              echo ""
              echo "| File | Change |"
              echo "|---|---|"
              jq -r '.changes_table[]? | "| `" + .file + "` | \(.change_summary) |"' review.json
              echo ""
            fi

            ISSUES_COUNT=$(jq '.issues | length' review.json)
            if [ "$ISSUES_COUNT" != "0" ] && [ "$ISSUES_COUNT" != "null" ]; then
              echo "### 🔍 Review Comments"
              echo ""

              for sev in blocking warning suggestion; do
                SEV_COUNT=$(jq --arg s "$sev" '[.issues[]? | select(.severity==$s)] | length' review.json)
                if [ "$SEV_COUNT" != "0" ]; then
                  case "$sev" in
                    blocking) ICON="🛑" ;;
                    warning) ICON="⚠️" ;;
                    suggestion) ICON="💡" ;;
                  esac
                  echo "#### $ICON ${sev^} ($SEV_COUNT)"
                  echo ""
                  jq -r --arg s "$sev" '
                    .issues[]? | select(.severity==$s) |
                    "<details>\n<summary><strong>\(.file_hint)" + (if .line_hint != "" then " — \(.line_hint)" else "" end) + "</strong>: \(.title)</summary>\n\n\(.problem)\n\n```diff\n- " + (.before_snippet | gsub("\n"; "\n- ")) + "\n+ " + (.after_snippet | gsub("\n"; "\n+ ")) + "\n```\n\n</details>\n"
                  ' review.json
                fi
              done
            fi

            echo ""
            echo "---"
            echo "*Automated review by Gemini. Verify suggestions before applying.*"
          } > comment.md

          gh pr comment $PR_NUMBER --body-file comment.md

          if [ "$APPROVED" != "true" ]; then
            echo "Blocking issues found ($BLOCKING_COUNT). Failing the check."
            exit 1
          fi

          echo "No blocking issues. Check passes."
